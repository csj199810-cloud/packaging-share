<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><title>包装效果预览</title><style>
:root{color-scheme:light;--accent:#7c3aed;--ink:#17171a;--muted:#77777e;--line:rgba(60,60,67,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:radial-gradient(circle at 50% 0,#fff 0,#f4f4f7 45%,#e9e9ee 100%);color:var(--ink)}main{width:min(920px,calc(100% - 32px));margin:auto;padding:56px 0 80px}.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.08em}h1{margin:10px 0 8px;font-size:clamp(28px,5vw,46px);letter-spacing:-.04em}.intro{margin:0;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:32px}.card{display:grid;gap:16px;min-height:150px;padding:18px;border:1px solid rgba(255,255,255,.9);border-radius:18px;background:rgba(255,255,255,.76);box-shadow:0 14px 36px rgba(34,28,48,.08);backdrop-filter:blur(18px);text-decoration:none;color:inherit;transition:transform .18s ease,box-shadow .18s ease}.card:hover{transform:translateY(-2px);box-shadow:0 18px 42px rgba(34,28,48,.12)}.card strong{font-size:17px}.meta{color:var(--muted);font-size:12px;line-height:1.5}.open{align-self:end;color:var(--accent);font-size:12px;font-weight:700}.empty{margin-top:32px;padding:22px;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}footer{margin-top:36px;color:var(--muted);font-size:11px}@media(max-width:540px){main{padding-top:30px}.grid{grid-template-columns:1fr}}
</style></head><body><main><div class="eyebrow">PACKAGING PREVIEW</div><h1>包装效果链接</h1><p class="intro">所有已发布包装集中在这里，点击即可进行 360° 旋转查看。</p><section class="grid" id="grid"></section><footer>由包装效果图软件 V1 发布</footer></main><script>
const entries=[{"path":"gs6","title":"GS6 破风彩盒","dimensions":[183,95,33],"updatedAt":"2026-08-21T01:20:00.012Z","version":1787275188184}],grid=document.getElementById('grid');if(!entries.length){grid.innerHTML='<div class="empty">还没有发布包装项目。</div>'}else entries.forEach(function(item){const card=document.createElement('a');card.className='card';card.href='./'+encodeURIComponent(item.path)+'/?v='+encodeURIComponent(item.version||item.updatedAt||'');const title=document.createElement('strong');title.textContent=item.title;const meta=document.createElement('span');meta.className='meta';meta.textContent=(item.dimensions||[]).join(' × ')+' mm';const open=document.createElement('span');open.className='open';open.textContent='打开 360° 预览 →';card.append(title,meta,open);grid.appendChild(card)});
</script></body></html>
